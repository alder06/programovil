<ion-header [translucent]="true">
  <ion-toolbar>
    <ion-buttons slot="start">
      <ion-back-button defaultHref="/principal"></ion-back-button>
    </ion-buttons>
    <ion-title>Cuenta</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true">
  <ion-header collapse="condense">
    <ion-toolbar>
      <ion-title size="large">Cuenta</ion-title>
    </ion-toolbar>
  </ion-header>

  <!-- Contenedor principal -->
  <div class="account-container ion-padding">
    <!-- Imagen de perfil del usuario -->
    <div class="profile-pic">
      <ion-img [src]="usuario.imagen_usuario" class="user-img"></ion-img>
    </div>

    <!-- Información del usuario -->
    <ion-list>
      <ion-item>
        <ion-label>
          <h2>Nombre</h2>
          <p>{{ usuario.nombre }}</p>
        </ion-label>
      </ion-item>
      <ion-item>
        <ion-label>
          <h2>Email</h2>
          <p>{{ usuario.email }}</p>
        </ion-label>
      </ion-item>
      <ion-item>
        <ion-label>
          <h2>Teléfono</h2>
          <p>{{ usuario.telefono }}</p>
        </ion-label>
      </ion-item>
    </ion-list>

    <!-- Botón para editar perfil -->
    <ion-button expand="block" (click)="editarPerfil()">Editar Perfil</ion-button>
  </div>
</ion-content>
